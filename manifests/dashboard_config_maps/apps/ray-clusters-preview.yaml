# "RayCluster (preview)" -- Ray/KubeRay dashboard across the ray, ray-test and
# ray-prod namespaces.
#
# Adapted from the upstream KubeRay dashboard (see ray-clusters.yaml for the
# unmodified original, uid ray-cluster-dashboard). Differences that matter:
#
#   * $namespace is the top-level variable; $Cluster, $SessionName, $Instance and
#     $pvc are all chained off it, and every ray_*/autoscaler_* selector carries an
#     explicit namespace=~"$namespace" matcher.
#   * "Tasks by Pipeline", "Pending/Running Tasks by Name" and the ray_job_* series
#     come from manifests/ray_exporter/ -- NOT from Ray's own metrics endpoint.
#   * "Persistent Volume Fill (%)" discovers PVCs via the $pvc variable, because the
#     names differ per environment (pipeline-data-hot/cold in ray,
#     pipeline-cache-hot/pipeline-data in ray-test and ray-prod).
#
# A namespace only appears in $namespace once its Ray pods are actually scraped;
# add new ones to the namespaceSelectors in
# additional_kube_prometheus_config/ray_podmonitors.yaml and to RAY_NAMESPACE in
# manifests/ray_exporter/ray-exporter.yaml.
#
# APPLY WITH --server-side. The embedded JSON is ~630KB, well over the 256KiB
# kubectl.kubernetes.io/last-applied-configuration annotation limit that plain
# `kubectl apply` needs:
#
#   kubectl apply --server-side -f manifests/dashboard_config_maps/apps/ray-clusters-preview.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-clusters-preview
  namespace: monitoring
  labels:
    app: ray-clusters-preview
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Apps
data:
  ray-clusters-preview.json: |-
    {
     "annotations": {
      "list": [
       {
        "builtIn": 1,
        "datasource": {
         "type": "datasource",
         "uid": "grafana"
        },
        "enable": true,
        "hide": true,
        "iconColor": "rgba(0, 211, 255, 1)",
        "name": "Annotations & Alerts",
        "type": "dashboard"
       }
      ]
     },
     "editable": true,
     "fiscalYearStartMonth": 0,
     "graphTooltip": 1,
     "links": [],
     "panels": [
      {
       "collapsed": true,
       "gridPos": {
        "h": 1,
        "w": 24,
        "x": 0,
        "y": 0
       },
       "id": 49,
       "panels": [
        {
         "id": 58,
         "type": "barchart",
         "title": "Tasks by Pipeline (running vs pending)",
         "description": "Current running vs pending tasks per pipeline, from the Ray State API via ray-exporter. Pipeline derived from the worker-group custom resource each task requests (spikesort_gpu/spikesort_cpu = spike-sorting, sync = sync). Idle pipelines show 0 bars.",
         "gridPos": {
          "h": 8,
          "w": 12,
          "x": 0,
          "y": 1
         },
         "datasource": {
          "uid": "${datasource}"
         },
         "targets": [
          {
           "datasource": {
            "uid": "${datasource}"
           },
           "refId": "A",
           "editorMode": "code",
           "format": "table",
           "instant": true,
           "range": false,
           "expr": "sum by (pipeline) (ray_pipeline_tasks_running{namespace=~\"$namespace\",cluster=~\"$Cluster\"})"
          },
          {
           "datasource": {
            "uid": "${datasource}"
           },
           "refId": "B",
           "editorMode": "code",
           "format": "table",
           "instant": true,
           "range": false,
           "expr": "sum by (pipeline) (ray_pipeline_tasks_pending{namespace=~\"$namespace\",cluster=~\"$Cluster\"})"
          }
         ],
         "transformations": [
          {
           "id": "joinByField",
           "options": {
            "byField": "pipeline",
            "mode": "outer"
           }
          },
          {
           "id": "organize",
           "options": {
            "excludeByName": {},
            "indexByName": {},
            "renameByName": {
             "Value #A": "Running",
             "Value #B": "Pending"
            }
           }
          }
         ],
         "fieldConfig": {
          "defaults": {
           "unit": "short",
           "min": 0,
           "decimals": 0,
           "color": {
            "mode": "palette-classic"
           },
           "custom": {
            "lineWidth": 1,
            "fillOpacity": 80,
            "gradientMode": "none",
            "axisPlacement": "auto",
            "axisLabel": "tasks"
           },
           "mappings": []
          },
          "overrides": [
           {
            "matcher": {
             "id": "byName",
             "options": "Running"
            },
            "properties": [
             {
              "id": "color",
              "value": {
               "mode": "fixed",
               "fixedColor": "green"
              }
             }
            ]
           },
           {
