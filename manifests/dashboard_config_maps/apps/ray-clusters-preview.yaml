          "orientation": "auto",
          "xField": "pipeline",
          "showValue": "always",
          "stacking": "none",
          "groupWidth": 0.7,
          "barWidth": 0.8,
          "fullHighlight": false,
          "legend": {
           "showLegend": true,
           "displayMode": "list",
           "placement": "bottom",
           "calcs": []
          },
          "tooltip": {
           "mode": "single",
           "sort": "none"
          }
